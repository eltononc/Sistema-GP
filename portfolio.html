        .btn-liquid-fill::before { content: ''; position: absolute; top: 0; left: 0; width: 100%; height: 100%; background-color: #06B6D4; transition: transform 0.5s ease; z-index: -1; transform-origin: left; transform: scaleX(0); }

    <script type="module">

        import { getFirestore, collection, onSnapshot, doc, deleteDoc, getDocs, setDoc, query, where } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-firestore.js";
        import { getAuth, signInAnonymously, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-auth.js";

        const firebaseConfig = {
            apiKey: "AIzaSyAtmxLoEIncNY-9_zyypEPgWEUNV_0mMHs",
            authDomain: "sistema-gp-5fe24.firebaseapp.com",
            projectId: "sistema-gp-5fe24",
            storageBucket: "sistema-gp-5fe24.firebasestorage.app",
            messagingSenderId: "80532029580",
            appId: "1:80532029580:web:ba7b41a79adad2774c7ba9"
        };
        const appId = firebaseConfig.projectId;

        let app, db, auth;
        let isAuthReady = false;
        let allPortfolios = [];
        let confirmCallback = null;

        try {
            app = initializeApp(firebaseConfig);
            db = getFirestore(app);
            auth = getAuth(app);
        } catch (error) {
            console.error("Erro ao inicializar o Firebase:", error);
            document.body.innerHTML = "Erro na configuração do Firebase. Verifique o console.";
        }

        function initializeGanttBackground() {
            const canvas = document.getElementById('backgroundCanvas');
            if (!canvas) return;
            const ctx = canvas.getContext('2d');
            
            const barHeight = 20, barGap = 40, numBarsPerLine = 3;
            const colors = { bar1: 'rgba(59, 130, 246, 0.1)', bar2: 'rgba(34, 197, 94, 0.1)', bar3: 'rgba(139, 92, 246, 0.1)'};
            const bars = [];
            const barColors = [colors.bar1, colors.bar2, colors.bar3];

            function initializeBars() {
                bars.length = 0;
                const totalLines = Math.ceil(canvas.height / (barHeight + barGap));
                for (let i = 0; i < totalLines * numBarsPerLine; i++) { 
                    bars.push({ 
                        width: (Math.random() * 0.2 + 0.1) * window.innerWidth, 
                        color: barColors[Math.floor(Math.random() * barColors.length)], 
                        initialXOffset: Math.random() * window.innerWidth 
                    }); 
                }
            }
            
            function roundRect(ctx, x, y, width, height, radius) { 
                ctx.beginPath(); 
                ctx.moveTo(x + radius, y); 
                ctx.arcTo(x + width, y, x + width, y + height, radius); 
                ctx.arcTo(x + width, y + height, x, y + height, radius); 
                ctx.arcTo(x, y + height, x, y, radius); 
                ctx.arcTo(x, y, x + width, y, radius); 
                ctx.closePath(); 
                ctx.fill(); 
            }
            
            function drawBackgroundElements() {
                ctx.clearRect(0, 0, canvas.width, canvas.height);
                const totalLines = Math.ceil(canvas.height / (barHeight + barGap));
                for (let i = 0; i < totalLines; i++) { 
                    const y = (i * (barHeight + barGap)) + (barGap / 2); 
                    for (let j = 0; j < numBarsPerLine; j++) { 
                        const bar = bars[i * numBarsPerLine + j]; 
                        if (!bar) continue;
                        let x = bar.initialXOffset;
                        ctx.fillStyle = bar.color; 
                        roundRect(ctx, x, y, bar.width, barHeight, 5); 
                    } 
                }
            }
            
            function resizeAnimationCanvas() { 
                canvas.width = window.innerWidth; 
                canvas.height = window.innerHeight; 
                initializeBars();
                drawBackgroundElements(); 
            }
            
            resizeAnimationCanvas();
            window.addEventListener('resize', resizeAnimationCanvas);
        }

        function showConfirmation(message, callback) { /* ... */ }
        function closeConfirmationModal() { /* ... */ }
        function showAlert(message) { /* ... */ }
        function closeAlertModal() { /* ... */ }

        async function populateUsersDropdown(selectedResponsibleId = null) {
            const responsibleSelect = document.getElementById('portfolioResponsible');
            responsibleSelect.innerHTML = '<option value="">Carregando...</option>';
            try {
                const usersRef = collection(db, `artifacts/${appId}/public/data/users`);
                const q = query(usersRef, where("profile", "in", ["Administrador", "Agente"]));
                const querySnapshot = await getDocs(q);
                const users = querySnapshot.docs.map(doc => ({ id: doc.id, ...doc.data() }));
                
                responsibleSelect.innerHTML = '<option value="">Selecione um responsável</option>';
                users.sort((a, b) => a.fullName.localeCompare(b.fullName));
                users.forEach(user => {
                    const option = document.createElement('option');
                    option.value = user.id;
                    option.textContent = user.fullName;
                    responsibleSelect.appendChild(option);
                });
                if (selectedResponsibleId) {
                    responsibleSelect.value = selectedResponsibleId;
                }
            } catch (error) {
                console.error("Erro ao carregar usuários:", error);
                responsibleSelect.innerHTML = '<option value="">Erro ao carregar</option>';
            }
        }

        async function savePortfolio() {
            const portfolioId = document.getElementById('portfolioId').value;
            const portfolioName = document.getElementById('portfolioName').value.trim();
            const responsibleSelect = document.getElementById('portfolioResponsible');
            const responsibleId = responsibleSelect.value;
            const responsibleName = responsibleSelect.options[responsibleSelect.selectedIndex].text;
            const startDate = document.getElementById('portfolioStartDate').value;
            const endDate = document.getElementById('portfolioEndDate').value;
            const stakeholders = document.getElementById('portfolioStakeholders').value.trim();
            const observations = document.getElementById('portfolioObservations').value.trim();

            if (portfolioName === "" || responsibleId === "") {
                showAlert("Nome e Responsável são obrigatórios.");
                return;
            }

            const portfolioData = {
                name: portfolioName,
                responsible: { id: responsibleId, name: responsibleName },
                startDate,
                endDate,
                stakeholders,
                observations,
            };

            if (portfolioId) {
                portfolioData.status = document.getElementById('portfolioStatus').value;
                try {
                    portfolioData.id = parseInt(portfolioId);
                    portfolioData.updatedAt = new Date();
                    const docRef = doc(db, `artifacts/${appId}/public/data/portfolios`, portfolioId);
                    await setDoc(docRef, portfolioData, { merge: true });
                    toggleForm(false);
                } catch (error) {
                    console.error("Erro ao atualizar portfólio:", error);
                    showAlert("Ocorreu um erro ao atualizar. Tente novamente.");
                }
            } else {
                portfolioData.status = 'Ativo';
                const portfoliosColRef = collection(db, `artifacts/${appId}/public/data/portfolios`);
                const querySnapshot = await getDocs(portfoliosColRef);
                const lastId = querySnapshot.docs.reduce((max, doc) => (parseInt(doc.id) > max ? parseInt(doc.id) : max), 0);
                const newId = lastId + 1;
                portfolioData.id = newId;
                portfolioData.createdAt = new Date();
                try {
                    await setDoc(doc(db, `artifacts/${appId}/public/data/portfolios`, newId.toString()), portfolioData);
                    toggleForm(false);
                } catch (error) {
                    console.error("Erro ao adicionar portfólio:", error);
                    showAlert("Ocorreu um erro ao salvar. Tente novamente.");
                }
            }
        }

        async function deletePortfolio(id) {
            if (!isAuthReady) { showAlert("Autenticação não está pronta."); return; }
            showConfirmation(`Tem certeza que deseja excluir o portfólio com ID ${id}?`, async () => {
                try {
                    await deleteDoc(doc(db, `artifacts/${appId}/public/data/portfolios`, id));
                } catch (error) {
                    console.error("Erro ao deletar portfólio:", error);
                    showAlert("Ocorreu um erro ao excluir.");
                }
            });
        }
        
        function renderPortfolios(portfolios) {
            const portfoliosTableBody = document.getElementById('portfoliosTableBody');
            if (!portfoliosTableBody) return;
            portfoliosTableBody.innerHTML = '';
            portfolios.sort((a, b) => parseInt(a.id) - parseInt(b.id));
            if (portfolios.length === 0) {
                portfoliosTableBody.innerHTML = '<tr><td colspan="7" class="text-center p-8">Nenhum portfólio encontrado.</td></tr>';
                return;
            }
            portfolios.forEach(port => {
                const tr = document.createElement('tr');
                tr.className = "bg-slate-900 border-b border-slate-700 hover:bg-slate-800 transition-colors";
                const status = port.status || 'Ativo';
                const statusColor = status === 'Ativo' ? 'bg-green-500/20 text-green-400' : 'bg-slate-500/20 text-slate-400';
                const formatDate = (date) => date ? new Date(date + 'T00:00:00').toLocaleDateString('pt-BR') : 'N/A';

                tr.innerHTML = `
                    <td class="px-6 py-4 font-medium text-white">${port.id}</td>
                    <td class="px-6 py-4"><span class="px-2 py-1 rounded-full text-xs font-semibold ${statusColor}">${status}</span></td>
                    <td class="px-6 py-4">${port.name}</td>
                    <td class="px-6 py-4">${port.responsible ? port.responsible.name : 'N/A'}</td>
                    <td class="px-6 py-4">${formatDate(port.startDate)}</td>
                    <td class="px-6 py-4">${formatDate(port.endDate)}</td>
                    <td class="px-6 py-4 text-right">
                        <div class="flex items-center justify-end gap-4">
                            <button class="text-sky-400 hover:text-sky-500 edit-btn" data-id="${port.id}" title="Editar"><svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M11 4H4a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2v-7"></path><path d="M18.5 2.5a2.121 2.121 0 0 1 3 3L12 15l-4 1 1-4 9.5-9.5z"></path></svg></button>
                            <button class="text-red-500 hover:text-red-600 delete-btn" data-id="${port.id}" title="Excluir"><svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="3 6 5 6 21 6"></polyline><path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6m3 0V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"></path></svg></button>
                        </div>
                    </td>
                `;
                portfoliosTableBody.appendChild(tr);
            });
        }

        function filterAndRenderPortfolios() {
            const searchTerm = document.getElementById('searchPortfoliosInput').value.toLowerCase();
            const filtered = allPortfolios.filter(port =>
                port.name.toLowerCase().includes(searchTerm) ||
                (port.responsible && port.responsible.name.toLowerCase().includes(searchTerm))
            );
            renderPortfolios(filtered);
        }

        function toggleForm(show, portfolio = null) {
            const cadastroForm = document.getElementById('cadastroFormContainer');
            const listContainer = document.getElementById('portfoliosListContainer');
            const searchContainer = document.getElementById('search-form-container');
            const formTitleEl = document.getElementById('formTitle');
            const saveButton = document.getElementById('savePortfolioButton');
            const statusContainer = document.getElementById('statusContainer');

            document.getElementById('portfolioId').value = "";
            document.getElementById('portfolioName').value = "";
            document.getElementById('portfolioResponsible').value = "";
            document.getElementById('portfolioStartDate').value = "";
            document.getElementById('portfolioEndDate').value = "";
            document.getElementById('portfolioStakeholders').value = "";
            document.getElementById('portfolioObservations').value = "";

            if (show) {
                populateUsersDropdown();
                listContainer.classList.add('hidden');
                searchContainer.classList.add('hidden');
                cadastroForm.classList.remove('hidden');

                if (portfolio) {
                    formTitleEl.textContent = 'Editar Portfólio';
                    saveButton.textContent = 'Atualizar';
                    statusContainer.classList.remove('hidden');
                    document.getElementById('portfolioId').value = portfolio.id;
                    document.getElementById('portfolioName').value = portfolio.name || '';
                    populateUsersDropdown(portfolio.responsible ? portfolio.responsible.id : null);
                    document.getElementById('portfolioStartDate').value = portfolio.startDate || '';
                    document.getElementById('portfolioEndDate').value = portfolio.endDate || '';
                    document.getElementById('portfolioStakeholders').value = portfolio.stakeholders || '';
                    document.getElementById('portfolioObservations').value = portfolio.observations || '';
                    document.getElementById('portfolioStatus').value = portfolio.status || 'Ativo';
                } else {
                    formTitleEl.textContent = 'Cadastrar Novo Portfólio';
                    saveButton.textContent = 'Salvar';
                    statusContainer.classList.add('hidden');
                }
            } else {
                cadastroForm.classList.add('hidden');
                listContainer.classList.remove('hidden');
                searchContainer.classList.remove('hidden');
            }
        }

        document.addEventListener('DOMContentLoaded', () => {
            initializeGanttBackground();
            renderSidebar(window.location.pathname);
            onAuthStateChanged(auth, async (user) => {
                if (!user) { try { await signInAnonymously(auth); } catch (error) { console.error("Auth Error:", error); } }
                isAuthReady = true;
                const portfoliosColRef = collection(db, `artifacts/${appId}/public/data/portfolios`);
                onSnapshot(portfoliosColRef, (snapshot) => {
                    allPortfolios = snapshot.docs.map(doc => ({ id: doc.id, ...doc.data() }));
                    filterAndRenderPortfolios();
                }, (error) => {
                    console.error("Erro ao carregar portfólios:", error);
                    document.getElementById('portfoliosTableBody').innerHTML = '<tr><td colspan="7" class="text-center p-8 text-red-400">Erro ao carregar. Verifique as permissões e o console.</td></tr>';
                });
            });
            document.getElementById('showFormButton').addEventListener('click', () => toggleForm(true, null));
            document.getElementById('cancelButton').addEventListener('click', () => toggleForm(false));
            document.getElementById('savePortfolioButton').addEventListener('click', () => savePortfolio());
            document.getElementById('searchPortfoliosInput').addEventListener('input', filterAndRenderPortfolios);
            document.getElementById('portfoliosTableBody').addEventListener('click', (e) => {
                const deleteButton = e.target.closest('.delete-btn');
                if (deleteButton) { deletePortfolio(deleteButton.dataset.id); return; }
                const editButton = e.target.closest('.edit-btn');
                if (editButton) {
                    const id = editButton.dataset.id;
                    const portfolioToEdit = allPortfolios.find(port => port.id.toString() === id.toString());
                    if (portfolioToEdit) { toggleForm(true, portfolioToEdit); }
                }
            });
            document.getElementById('confirmationModalCancelBtn').addEventListener('click', () => closeConfirmationModal());
            document.getElementById('confirmationModalConfirmBtn').addEventListener('click', () => { if (typeof confirmCallback === 'function') { confirmCallback(); } closeConfirmationModal(); });
            document.getElementById('alertModalOkBtn').addEventListener('click', () => closeAlertModal());
        });
    </script>
</body>
</html>
