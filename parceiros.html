<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Stake Pro - Parceiros</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&family=Montserrat:wght@500;800&display=swap" rel="stylesheet">
    <script type="module" src="settings.js" defer></script>
    <script type="module" src="parceiros.js" defer></script>

    <style>
        /* Estilos base */
        body {
            font-family: 'Inter', sans-serif;
            background-color: #0F172A;
            color: #E2E8F0;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            -webkit-font-smoothing: antialiased;
            -moz-osx-font-smoothing: grayscale;
            overflow-x: hidden;
        }
        .logotext-stake {
            font-family: 'Montserrat', sans-serif;
            font-weight: 800;
            font-size: 1.75rem; /* Menor que o anterior */
            line-height: 1;
            letter-spacing: -0.05em;
        }
        .logotext-sub {
            font-family: 'Inter', sans-serif;
            font-weight: 400;
            font-size: 0.65rem; /* Menor que o anterior */
            color: #94A3B8;
        }
        #backgroundCanvas {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: -1;
            opacity: 0.15;
        }
        .glass-effect {
            background-color: rgba(30, 41, 59, 0.4);
            backdrop-filter: blur(10px);
            border: 1px solid rgba(71, 85, 105, 0.5);
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1), 0 2px 4px -1px rgba(0, 0, 0, 0.06);
        }
        .sidebar-link.active {
            background-color: rgba(30, 41, 59, 0.6);
            border-left: 4px solid #0EA5E9;
            color: #0EA5E9;
            font-weight: 600;
        }
        .sidebar-link:not(.active):hover {
            background-color: rgba(30, 41, 59, 0.6);
            transform: scale(1.02);
        }
        .sidebar-link, .sidebar-link-button {
            transition: all 0.3s ease;
        }
        .sidebar-link-button:hover {
            transform: scale(1.02);
        }
        
        /* Estilos do botão 'Liquid Fill' */
        .btn-liquid-fill {
            position: relative;
            background: transparent;
            border: 1px solid #06B6D4;
            color: #06B6D4;
            overflow: hidden;
            z-index: 10;
            font-weight: 600;
            transition: all 0.3s ease;
            padding: 0.5rem 1rem;
            font-size: 0.875rem;
            border-radius: 0.5rem;
        }
        .btn-liquid-fill::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-color: #06B6D4;
            transition: transform 0.5s ease;
            z-index: -1;
            transform-origin: left;
            transform: scaleX(0);
        }
        .btn-liquid-fill:hover::before {
            transform: scaleX(1);
        }
        .btn-liquid-fill:hover {
            color: white;
            transform: translateY(-2px);
            box-shadow: 0 10px 15px -3px rgba(0, 0, 0, 0.1), 0 2px 4px -1px rgba(0, 0, 0, 0.05);
        }
        .btn-liquid-fill:active {
            transform: translateY(0);
            box-shadow: none;
        }
        .btn-liquid-fill svg {
            transition: color 0.3s ease;
        }
        .btn-liquid-fill:hover svg {
            color: white;
        }

        /* Estilos do Título Modelo 6 */
        .title-6 {
            font-size: 2rem; /* text-4xl */
            font-weight: 800; /* font-extrabold */
            color: white;
            position: relative;
            padding-bottom: 0.5rem;
            width: fit-content;
            margin-right: auto;
        }
        .title-6::after {
            content: '';
            position: absolute;
            bottom: 0;
            left: 0;
            width: 100%;
            height: 2px;
            background: linear-gradient(to right, #0EA5E9, #22C55E);
        }

        /* Estilos para o Modelo 4 de seleção de dias */
        .days-icon-selection {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(60px, 1fr));
            gap: 0.5rem;
        }
        .days-icon-selection label {
            display: flex;
            flex-direction: column;
            align-items: center;
            border-radius: 0.5rem;
            cursor: pointer;
            transition: all 0.2s ease;
            user-select: none;
        }
        .days-icon-selection input {
            display: none;
        }
        .days-icon-selection input:checked + .days-card {
            background-color: #0EA5E9;
            color: white;
            border-color: #0EA5E9;
            transform: translateY(-2px);
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1);
        }
        .days-icon-selection input:not(:checked) + .days-card:hover {
            background-color: #334155;
            border-color: #0EA5E9;
        }
        .days-card {
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 0.5rem; /* Reduzido o preenchimento vertical */
            border-radius: 0.5rem;
            background-color: #1E293B;
            border: 1px solid #475569;
            transition: all 0.2s ease;
            width: 100%;
        }
        .days-card p {
            font-size: 0.625rem; /* Fonte menor */
            margin-top: 0.125rem; /* Margem superior menor */
            font-weight: 600;
        }
        .days-card .days-icon {
            font-family: 'Montserrat', sans-serif;
            font-weight: 800;
            font-size: 1rem; /* Fonte do ícone menor */
        }
        
        /* Estilos para as tags de funções */
        .function-tag {
            display: inline-flex;
            align-items: center;
            background-color: #334155;
            color: #cbd5e1;
            padding: 0.25rem 0.75rem;
            border-radius: 9999px;
            font-size: 0.875rem;
            margin-right: 0.5rem;
            margin-bottom: 0.5rem;
        }
        .remove-tag-btn {
            margin-left: 0.5rem;
            background: none;
            border: none;
            color: #94a3b8;
            cursor: pointer;
            font-size: 1.25rem;
            line-height: 1;
            padding: 0;
            transition: color 0.2s ease;
        }
        .remove-tag-btn:hover {
            color: #e2e8f0;
        }
        .table-cell-responsive {
            word-break: break-word;
            padding-left: 1.5rem; /* Default px-6 */
            padding-right: 1.5rem; /* Default px-6 */
        }

        /* Apply smaller padding on medium screens and below */
        @media (max-width: 1023px) { /* Corresponds to Tailwind's 'lg' breakpoint */
            .table-cell-responsive {
                padding-left: 0.75rem; /* px-3 */
                padding-right: 0.75rem; /* px-3 */
            }
        }
        .submenu-content.max-h-0 {
            max-height: 0;
        }
        .submenu-content.max-h-screen {
            max-height: 100vh; /* Or a sufficiently large value */
        }
        .submenu-arrow.rotate-180 {
            transform: rotate(180deg);
        }
        /* Estilos para o dropdown customizado */
        .custom-multiselect-dropdown {
            max-height: 200px;
            overflow-y: auto;
        }
        .custom-multiselect-dropdown label {
            display: flex; /* Ensure flex display for alignment */
            align-items: center; /* Vertically align items */
            padding: 0.5rem 1rem;
            cursor: pointer;
            transition: background-color 0.2s ease;
        }
        .custom-multiselect-dropdown label:hover {
            background-color: #334155; /* slate-700 */
        }
        .custom-multiselect-dropdown label input {
            margin-right: 0.75rem;
        }
        .custom-multiselect-dropdown .optgroup-label {
            padding: 0.75rem 1rem;
            font-weight: 600;
            color: #94a3b8; /* slate-400 */
            font-size: 0.875rem;
            background-color: #1E293B; /* slate-800, a slightly darker background for the group label */
            border-bottom: 1px solid #475569; /* Add a subtle border below the group label */
            margin-top: 0.5rem; /* Add some space above the group label */
            margin-bottom: 0.25rem; /* Add some space below the group label */
        }
    </style>
</head>
<body class="bg-slate-950 text-slate-200 antialiased font-inter flex flex-col md:flex-row min-h-screen">

    <!-- Modal de Alerta Genérico -->

    <!-- Modal para Detalhes do Parceiro -->
    <div id="partnerDetailsModal" class="fixed inset-0 bg-black/60 hidden items-center justify-center z-50 p-4">

            <h3 class="text-lg font-bold text-white mb-4">Detalhes do Parceiro</h3>
            <input type="hidden" id="detailsPartnerId">
